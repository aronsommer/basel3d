name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Inject build timestamp
        run: |
          BUILD_TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
          sed -i "s|__BUILD_TIMESTAMP__|${BUILD_TIMESTAMP}|g" index.html src/main.js
          echo "Injected build timestamp: $BUILD_TIMESTAMP"

      # src/ as one minified src/main.js, loaded with ?v=; three.js stays on the import map. The
      # map's worker (src/ground.js starts it, with ?v=) and the graffiti's painter (src/main.js
      # starts it, with ?v=) each as one file of its own.
      - name: Bundle scripts
        run: |
          npx --yes esbuild@0.28.2 src/main.js --bundle --minify --format=esm --external:three "--external:three/addons/*" --outfile=src/main.js --allow-overwrite
          npx --yes esbuild@0.28.2 src/ground-worker.js --bundle --minify --format=esm --outfile=src/ground-worker.js --allow-overwrite
          npx --yes esbuild@0.28.2 src/painter-worker.js --bundle --minify --format=esm --outfile=src/painter-worker.js --allow-overwrite

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
