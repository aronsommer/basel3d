<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basel 3D</title>
    <link rel="preload" href="fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Inter";
        font-weight: 100 900;
        src: url(fonts/Inter.woff2) format("woff2");
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #bfd8ea;
        font:
          13px/1.4 "Inter",
          sans-serif;
        color: #1d242b;
        -webkit-tap-highlight-color: transparent; /* no blue flash on tap on mobile */
      }
      canvas {
        display: block;
      }
      p {
        margin: 0;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 16px;
        font-size: 18px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      }
      /* The ground button and the closed menu of the lines: the same size, one below the other.
         The button to get off in the ground button's place. */
      #ground,
      #off,
      #lines {
        position: absolute;
        right: 12px;
        box-sizing: border-box;
        width: 96px;
        padding: 8px 14px;
        font: inherit;
        color: inherit;
        text-align: center;
        background: rgba(255, 255, 255, 0.9);
        border: 0;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        -webkit-user-select: none; /* Safari */
        user-select: none;
      }
      #ground,
      #off {
        top: 12px;
        cursor: pointer;
      }
      /* Tiny, in the corner, with a white halo. */
      #credit {
        position: absolute;
        bottom: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap-reverse;
        justify-content: flex-end;
        column-gap: 5px;
        max-width: 100%;
        padding: 2.5px 5px;
        box-sizing: border-box;
        font-size: 10px;
        line-height: 1.6;
        color: #000;
        text-shadow:
          -1px -1px 0 #fff,
          1px -1px 0 #fff,
          -1px 1px 0 #fff,
          1px 1px 0 #fff;
      }
      #credit span {
        white-space: nowrap;
      }
      #credit a {
        color: inherit;
        text-decoration: none;
      }
      /* The menu of the lines, below the ground button. */
      #lines {
        top: 58px;
      }
      /* Open: a panel of the lines as wide as they need, left-aligned, the chevron on the right of
         the title. */
      #lines[open] {
        width: auto;
        min-width: 96px;
        text-align: left;
      }
      #lines summary {
        list-style: none;
        cursor: pointer;
      }
      #lines summary::-webkit-details-marker {
        display: none;
      }
      #lines[open] summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
      /* A chevron: down when closed, up when open. */
      #lines summary::after {
        content: "";
        display: inline-block;
        width: 5px;
        height: 5px;
        margin-left: 8px;
        border-right: 2px solid;
        border-bottom: 2px solid;
        transform: translateY(-3px) rotate(45deg);
      }
      #lines[open] summary::after {
        transform: translateY(2px) rotate(-135deg);
      }
      /* A box close to its text; "All" a little apart from "Trams". */
      #lines label,
      #lines .heading {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
      }
      #lines label {
        cursor: pointer;
      }
      #lines .heading {
        gap: 16px;
      }
      #lines input {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: #ff00ff;
        cursor: pointer;
      }
      /* "All" neutral, as it stands for lines of all colours. */
      #lines #trams {
        accent-color: #1d242b;
      }
      /* The tram lines one by one below the heading, five in a row, each pair of box and number
         well apart from the next. */
      #tram-lines {
        display: grid;
        grid-template-columns: repeat(5, auto);
        justify-content: start;
        column-gap: 16px;
        font-variant-numeric: tabular-nums;
      }
      /* The trams' line numbers (updateBadges in src/main.js), below the buttons and the menu. */
      #badges {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #badges div {
        position: absolute;
        top: 0;
        left: 0;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        font-size: 12px;
        font-weight: 600;
        line-height: 22px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      body:not([data-mode="loading"]) #loading,
      body:not([data-mode="orbit"]) #ground,
      body:not([data-mode="orbit"]) #lines,
      body:not([data-mode="ride"]) #off {
        display: none;
      }
    </style>
  </head>
  <body data-mode="loading">
    <div id="badges"></div>
    <div id="loading">Loading Basel <span id="progress">0%</span></div>
    <button id="ground"></button>
    <button id="off">Get off</button>
    <details id="lines">
      <summary>Lines</summary>
      <div class="heading">
        Trams
        <label><input type="checkbox" id="trams" /> All</label>
      </div>
      <div id="tram-lines"></div>
      <label><input type="checkbox" data-kind="train" /> Trains</label>
      <label><input type="checkbox" data-kind="car" /> Cars</label>
      <label><input type="checkbox" data-kind="ship" /> Ships</label>
    </details>
    <div id="credit">
      <span
        >©
        <a href="https://www.swisstopo.admin.ch/" target="_blank" rel="noopener">swisstopo</a></span
      >
      <span
        >©
        <a href="https://www.geo.bs.ch/" target="_blank" rel="noopener"
          >Geodaten Kanton Basel-Stadt</a
        ></span
      >
      <span
        >©
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener"
          >OpenStreetMap</a
        ></span
      >
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
