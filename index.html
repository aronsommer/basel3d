<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basel 3D</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #bfd8ea;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: #1d242b;
      }
      canvas {
        display: block;
      }
      p {
        margin: 0;
      }
      #loading,
      #walkhelp {
        position: absolute;
        left: 50%;
        padding: 10px 16px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      }
      #loading {
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 18px;
      }
      #walkhelp {
        bottom: 40px;
        transform: translateX(-50%);
        white-space: nowrap;
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
      }
      #hint,
      #credit {
        position: absolute;
        bottom: 6px;
        font-size: 12px;
        color: #3d464e;
      }
      #hint {
        left: 8px;
      }
      #credit {
        right: 8px;
      }
      body:not([data-mode="loading"]) #loading,
      body:not([data-mode="orbit"]) #hint,
      body:not([data-mode="walk"]) #walkhelp,
      body:not([data-mode="walk"]) #crosshair {
        display: none;
      }
      @media (max-width: 600px) {
        #walkhelp {
          white-space: normal;
          width: calc(100% - 64px);
        }
      }
      @media (max-width: 1000px) {
        #hint {
          display: none;
        }
      }
    </style>
  </head>
  <body data-mode="loading">
    <div id="loading">Lade Basel … <span id="progress">0 %</span></div>
    <div id="crosshair"></div>
    <p id="walkhelp">WASD / Pfeiltasten: gehen · Shift: rennen · Maus: umsehen · Esc: zurück</p>
    <p id="hint">
      Ziehen: verschieben · Rechts oder Alt/Cmd + Ziehen: drehen · Doppelklick: herumlaufen
    </p>
    <p id="credit">
      swissBUILDINGS3D 3.0, swissALTI3D, SWISSIMAGE · Quelle: Bundesamt für Landestopografie
      swisstopo
    </p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
