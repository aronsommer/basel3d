<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basel 3D</title>
    <link rel="preload" href="fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="style.css?v=__BUILD_TIMESTAMP__" />
  </head>
  <body data-mode="loading">
    <div id="names"></div>
    <div id="badges"></div>
    <div id="loading">Loading <span id="progress">0%</span></div>
    <button id="off">Get off<kbd> (Esc)</kbd></button>
    <button id="reset" title="Rebuild all that was blown up" hidden>Rebuild</button>
    <div id="counter">
      <p title="Buildings">
        <svg viewBox="4 3 16 18" aria-hidden="true">
          <path d="M6 19h3v-6h6v6h3v-9l-6-4.5L6 10v9Zm-2 2V9l8-6 8 6v12h-7v-6h-2v6H4Z" /></svg
        ><span id="Buildings"></span>
      </p>
      <p title="Bridges">
        <svg viewBox="4 3 16 18" aria-hidden="true">
          <path
            d="M5 10v10h3v-2a4 4 0 0 1 8 0v2h3V10M4 10h16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        <span id="Bridges"></span>
      </p>
    </div>
    <div id="panels"></div>
    <div id="crosshair" hidden></div>
    <div id="copied" hidden>Coordinates<br />copied</div>
    <div id="steer" hidden>
      <button data-key="ArrowLeft" aria-label="Turn left">←<kbd>A</kbd></button>
      <button data-key="ArrowUp" aria-label="Up">↑<kbd>W</kbd></button>
      <button data-key="ArrowDown" aria-label="Down">↓<kbd>S</kbd></button>
      <button data-key="ArrowRight" aria-label="Turn right">→<kbd>D</kbd></button>
      <button data-key="Space" aria-label="Fire" title="Hold Space or the left mouse button">
        Fire<kbd>Space / Mouse</kbd>
      </button>
      <button id="stop">Stop<kbd>Q</kbd></button>
    </div>
    <details id="menu">
      <summary>Menu</summary>
      <div id="entries">
        <div class="pairs">
          <label><input type="radio" name="ground" value="map" /> <span>Map</span></label>
          <label><input type="radio" name="ground" value="photo" /> <span>Aerial</span></label>
        </div>
        <hr />
        <label><input type="checkbox" id="names-box" /> Names</label>
        <hr />
        <div id="tram-lines">
          <span>Trams</span>
          <label><input type="checkbox" id="trams" /> All</label>
        </div>
        <div class="pairs">
          <label><input type="checkbox" data-kind="train" /> Trains</label>
          <label><input type="checkbox" data-kind="car" /> Cars</label>
          <label><input type="checkbox" data-kind="ship" /> Ships</label>
          <label><input type="checkbox" data-kind="walk" /> Walks</label>
        </div>
        <hr />
        <div class="pairs">
          <label><input type="checkbox" id="points-box" /> Points</label>
          <label><input type="checkbox" id="dev-box" /> Dev</label>
        </div>
        <hr />
        <!-- The deploy workflow replaces this with the UTC time of the deploy. -->
        <div id="about">
          <a href="https://github.com/aronsommer/basel3d" target="_blank" rel="noopener">GitHub</a>
          <span>Version __BUILD_TIMESTAMP__</span>
        </div>
        <div id="credits">
          <span
            >©
            <a href="https://www.swisstopo.admin.ch/" target="_blank" rel="noopener"
              >swisstopo</a
            ></span
          >
          <span
            >© <a href="https://www.geo.bs.ch/" target="_blank" rel="noopener">Geodaten BS</a></span
          >
          <span
            >©
            <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener"
              >OpenStreetMap</a
            ></span
          >
        </div>
      </div>
    </details>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="src/main.js?v=__BUILD_TIMESTAMP__"></script>
  </body>
</html>
