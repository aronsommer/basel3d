<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basel 3D</title>
    <link rel="preload" href="fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Inter";
        font-weight: 100 900;
        src: url(fonts/Inter.woff2) format("woff2");
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #bfd8ea;
        font:
          13px/1.4 "Inter",
          sans-serif;
        color: #1d242b;
        -webkit-tap-highlight-color: transparent; /* no blue flash on tap on mobile */
      }
      canvas {
        display: block;
      }
      p {
        margin: 0;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 16px;
        font-size: 18px;
        white-space: nowrap; /* one line, also on phones */
        background: rgba(255, 255, 255, 0.9);
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      }
      /* The ground button, the closed menu of the layers and the reset button: the same size, one
         below the other; the open menu covers the reset button. The button to get off the same
         size, to the left of the ground button. */
      #ground,
      #off,
      #reset,
      #layers {
        position: absolute;
        right: 12px;
        box-sizing: border-box;
        width: 96px;
        padding: 8px 14px;
        font: inherit;
        color: inherit;
        text-align: center;
        background: rgba(255, 255, 255, 0.9);
        border: 0;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        -webkit-user-select: none; /* Safari */
        user-select: none;
      }
      #ground,
      #off {
        top: 12px;
      }
      #ground,
      #off,
      #reset {
        cursor: pointer;
      }
      #off {
        right: 116px; /* 12px + the ground button's 96px + 8px */
      }
      #reset {
        top: 104px; /* as far below the menu (58px) as the menu is below the ground button */
      }
      /* Tiny, in the corner, with a white halo. */
      #credit {
        position: absolute;
        bottom: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap-reverse;
        justify-content: flex-end;
        column-gap: 5px;
        max-width: 100%;
        padding: 2.5px 5px;
        box-sizing: border-box;
        font-size: 10px;
        line-height: 1.6;
        color: #000;
        text-shadow:
          -1px -1px 0 #fff,
          1px -1px 0 #fff,
          -1px 1px 0 #fff,
          1px 1px 0 #fff;
      }
      #credit span {
        white-space: nowrap;
      }
      #credit a {
        color: inherit;
        text-decoration: none;
      }
      /* The menu of the layers, below the ground button. */
      #layers {
        top: 58px;
      }
      /* Open: a panel of the layers as wide as they need, left-aligned, the chevron on the right of
         the title. */
      #layers[open] {
        width: auto;
        min-width: 96px;
        text-align: left;
      }
      #layers summary {
        list-style: none;
        cursor: pointer;
      }
      #layers summary::-webkit-details-marker {
        display: none;
      }
      /* As tall as the rows below, to be easy to tap. */
      #layers[open] summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 28px;
      }
      /* A chevron: down when closed, up when open. */
      #layers summary::after {
        content: "";
        display: inline-block;
        width: 5px;
        height: 5px;
        margin-left: 8px;
        border-right: 2px solid;
        border-bottom: 2px solid;
        transform: translateY(-3px) rotate(45deg);
      }
      #layers[open] summary::after {
        transform: translateY(2px) rotate(-135deg);
      }
      /* A box close to its text; "All" a little apart from "Trams". Each label only as wide as its
         box and text, so a tap beside it does not tick it. */
      #layers label,
      #layers .heading {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
      }
      #layers label {
        width: fit-content;
        cursor: pointer;
      }
      #layers .heading {
        gap: 16px;
      }
      #layers input {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: #ff00ff;
        cursor: pointer;
      }
      /* The names apart from the lines below them. */
      #layers hr {
        margin: 4px 0;
        border: 0;
        border-top: 1px solid rgba(0, 0, 0, 0.12);
      }
      /* "All" neutral, as it stands for lines of all colours; "Names" neutral, as it shows none. */
      #layers #trams,
      #layers #names-box {
        accent-color: #1d242b;
      }
      /* The tram lines one by one below the heading, five in a row, each pair of box and number
         well apart from the next. */
      #tram-lines {
        display: grid;
        grid-template-columns: repeat(5, auto);
        justify-content: start;
        column-gap: 16px;
        font-variant-numeric: tabular-nums;
      }
      /* The names (updateNames in src/main.js), below the badges, the buttons and the menu; each
         with its bottom middle on its point, in a white halo: quarters and towns in spaced grey
         capitals, landmarks dark above a dot. */
      #names {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #names div {
        position: absolute;
        top: 0;
        left: 0;
        white-space: nowrap;
        font-weight: 600;
        text-shadow:
          -1px -1px 0 #fff,
          1px -1px 0 #fff,
          -1px 1px 0 #fff,
          1px 1px 0 #fff;
      }
      #names .place {
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #56616b;
      }
      #names .landmark {
        padding-bottom: 9px;
        font-size: 12px;
        color: #1d242b;
      }
      #names .landmark::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 6px;
        height: 6px;
        margin-left: -3px;
        border-radius: 50%;
        background: #1d242b;
        box-shadow: 0 0 0 2px #fff;
      }
      /* The trams' line numbers (updateBadges in src/main.js), below the buttons and the menu. */
      #badges {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #badges div {
        position: absolute;
        top: 0;
        left: 0;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        font-size: 12px;
        font-weight: 600;
        line-height: 22px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      /* The helicopter's steering buttons, at the bottom in the middle, while riding it, laid out
         like the arrow keys. With a mouse, each also shows its letter key (W, A, S, D). */
      #steer {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        grid-template-areas:
          ". ArrowUp ."
          "ArrowLeft ArrowDown ArrowRight";
        gap: 8px;
      }
      #steer [data-key="ArrowUp"] {
        grid-area: ArrowUp;
      }
      #steer [data-key="ArrowLeft"] {
        grid-area: ArrowLeft;
      }
      #steer [data-key="ArrowDown"] {
        grid-area: ArrowDown;
      }
      #steer [data-key="ArrowRight"] {
        grid-area: ArrowRight;
      }
      #steer[hidden] {
        display: none;
      }
      #steer button {
        width: 48px;
        height: 48px;
        padding: 0;
        font: inherit;
        font-size: 20px;
        color: inherit;
        background: rgba(255, 255, 255, 0.9);
        border: 0;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        cursor: pointer;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none; /* Safari */
        user-select: none;
      }
      #steer kbd {
        display: none;
        font: inherit;
        font-size: 15px;
        line-height: 1;
      }
      @media (pointer: fine) {
        #steer kbd {
          display: block;
        }
      }
      body:not([data-mode="loading"]) #loading,
      body[data-mode="loading"] #ground,
      body[data-mode="loading"] #layers,
      body:not([data-mode="ride"]) #off,
      body[data-mode="loading"] #reset {
        display: none;
      }
    </style>
  </head>
  <body data-mode="loading">
    <div id="names"></div>
    <div id="badges"></div>
    <div id="loading">Loading <span id="progress">0%</span></div>
    <button id="ground"></button>
    <button id="off">Get off</button>
    <button id="reset" title="Rebuild all that was blown up" hidden>Reset</button>
    <div id="steer" hidden>
      <button data-key="ArrowLeft" aria-label="Turn left">←<kbd>A</kbd></button>
      <button data-key="ArrowUp" aria-label="Up">↑<kbd>W</kbd></button>
      <button data-key="ArrowDown" aria-label="Down">↓<kbd>S</kbd></button>
      <button data-key="ArrowRight" aria-label="Turn right">→<kbd>D</kbd></button>
    </div>
    <details id="layers">
      <summary>Layers</summary>
      <label><input type="checkbox" id="names-box" /> Names</label>
      <hr />
      <div class="heading">
        Trams
        <label><input type="checkbox" id="trams" /> All</label>
      </div>
      <div id="tram-lines"></div>
      <label><input type="checkbox" data-kind="train" /> Trains</label>
      <label><input type="checkbox" data-kind="car" /> Cars</label>
      <label><input type="checkbox" data-kind="ship" /> Ships</label>
    </details>
    <div id="credit">
      <span
        >©
        <a href="https://www.swisstopo.admin.ch/" target="_blank" rel="noopener">swisstopo</a></span
      >
      <span
        >©
        <a href="https://www.geo.bs.ch/" target="_blank" rel="noopener"
          >Geodaten Kanton Basel-Stadt</a
        ></span
      >
      <span
        >©
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener"
          >OpenStreetMap</a
        ></span
      >
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
