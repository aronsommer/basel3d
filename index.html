<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Basel 3D</title>
    <link rel="stylesheet" href="style.css?v=__BUILD_TIMESTAMP__" />
  </head>
  <body data-mode="loading">
    <div id="names"></div>
    <div id="badges"></div>
    <div id="loading" role="progressbar" aria-label="Loading"><div id="progress"></div></div>
    <button id="off" aria-label="Get off" title="Get off (Esc)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" /></svg>
    </button>
    <button id="walk" aria-label="Walk" aria-pressed="false" title="Walk: then click where">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="2.5" r="1.5" />
        <path d="M8 6v4.5l-2.5 4M8 10.5l2.5 4M4 8l4-2 4 2" />
      </svg>
    </button>
    <button id="north" aria-label="North up" title="Look straight down, north up">
      <svg viewBox="5.5 0.5 5 15" aria-hidden="true">
        <path d="M8 0.5V8H5.5Z" fill="#f44336" />
        <path d="M8 0.5V8h2.5Z" fill="#c62828" />
        <path d="M8 15.5V8H5.5Z" fill="#fff" />
        <path d="M8 15.5V8h2.5Z" fill="#bdbdbd" />
      </svg>
    </button>
    <div id="counter">
      <p title="Buildings">
        <svg viewBox="4 3 16 18" aria-hidden="true">
          <path d="M4 21V9l8-6 8 6v12h-6v-7h-4v7H4Z" /></svg
        ><span id="Buildings"></span>
      </p>
      <p title="Bridges">
        <svg viewBox="4 3 16 18" aria-hidden="true">
          <path d="M4 9h16v12h-4v-3a4 4 0 0 0-8 0v3H4Z" />
        </svg>
        <span id="Bridges"></span>
      </p>
    </div>
    <div id="panels"></div>
    <div id="crosshair" hidden></div>
    <div id="where" hidden>Where to walk?</div>
    <div id="esc" hidden>Esc to exit</div>
    <div id="dot" hidden></div>
    <div id="copied" hidden>Coordinates<br />copied</div>
    <div id="steer" hidden>
      <button data-key="ArrowLeft" aria-label="Turn left">←<kbd>A</kbd></button>
      <button data-key="ArrowUp" aria-label="Up">↑<kbd>W</kbd></button>
      <button data-key="ArrowDown" aria-label="Down">↓<kbd>S</kbd></button>
      <button data-key="ArrowRight" aria-label="Turn right">→<kbd>D</kbd></button>
      <button data-key="Space" aria-label="Fire" title="Hold Space or the left mouse button">
        Fire<kbd>Space / Mouse</kbd>
      </button>
      <button id="stop">Stop<kbd>Q</kbd></button>
    </div>
    <details id="menu">
      <summary aria-label="Menu">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M1 3h14M1 8h14M1 13h14" />
          <path d="M3 3l10 10M13 3 3 13" />
        </svg>
      </summary>
      <div id="entries">
        <div class="pairs">
          <label><input type="checkbox" id="names-box" /> Names</label>
          <label><input type="checkbox" id="fullscreen-box" /> Fullscreen</label>
          <label><input type="checkbox" id="night-box" /> Night</label>
          <label id="aim"><input type="checkbox" id="aim-box" /> Mouse aim</label>
        </div>
        <hr />
        <div id="tram-lines">
          <label><input type="checkbox" id="trams" /> Trams</label>
        </div>
        <hr />
        <div class="triples">
          <label><input type="checkbox" data-kind="train" /> Trains</label>
          <label><input type="checkbox" data-kind="car" /> Cars</label>
          <label><input type="checkbox" data-kind="ship" /> Ships</label>
          <label><input type="checkbox" data-kind="walk" /> Walks</label>
          <label><input type="checkbox" data-kind="bike" /> Bikes</label>
          <label><input type="checkbox" data-kind="swim" /> Swimmers</label>
        </div>
        <hr />
        <div class="pairs">
          <label><input type="checkbox" id="points-box" /> Points</label>
          <label><input type="checkbox" id="dev-box" /> Dev</label>
        </div>
        <button id="reset" title="Rebuild all that was blown up" disabled>Rebuild Basel</button>
        <!-- The deploy workflow replaces this with the UTC time of the deploy. -->
        <div id="about">
          <a href="https://github.com/aronsommer/basel3d" target="_blank" rel="noopener">GitHub</a>
          <span>Version __BUILD_TIMESTAMP__</span>
        </div>
        <div id="credits">
          <span
            >©
            <a href="https://www.swisstopo.admin.ch/" target="_blank" rel="noopener"
              >swisstopo</a
            ></span
          >
          <span
            >© <a href="https://www.geo.bs.ch/" target="_blank" rel="noopener">Geodaten BS</a></span
          >
          <span
            >©
            <a href="https://data.bs.ch/explore/dataset/100008/" target="_blank" rel="noopener"
              >IWB</a
            ></span
          >
          <span
            >©
            <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener"
              >OpenStreetMap</a
            ></span
          >
        </div>
      </div>
    </details>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="src/main.js?v=__BUILD_TIMESTAMP__"></script>
  </body>
</html>
