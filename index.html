<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basel 3D</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #bfd8ea;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: #1d242b;
      }
      canvas {
        display: block;
      }
      p {
        margin: 0;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 16px;
        font-size: 18px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      }
      #ground {
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 8px 14px;
        font: inherit;
        color: inherit;
        background: rgba(255, 255, 255, 0.9);
        border: 0;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* Invisible longest label (main.js GROUND_LABELS), so the width never changes. */
      #ground::after {
        content: "Luftbild";
        height: 0;
        visibility: hidden;
      }
      /* Tiny, in the corner, with a white halo. */
      #credit {
        position: absolute;
        bottom: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap-reverse;
        justify-content: flex-end;
        column-gap: 5px;
        max-width: 100%;
        padding: 2.5px 5px;
        box-sizing: border-box;
        font-size: 10px;
        line-height: 1.6;
        text-shadow:
          -1px -1px 0 #fff,
          1px -1px 0 #fff,
          -1px 1px 0 #fff,
          1px 1px 0 #fff;
      }
      #credit span {
        white-space: nowrap;
      }
      #credit a {
        color: inherit;
        text-decoration: none;
      }
      body:not([data-mode="loading"]) #loading,
      body:not([data-mode="orbit"]) #ground {
        display: none;
      }
    </style>
  </head>
  <body data-mode="loading">
    <div id="loading">Lade Basel <span id="progress">0 %</span></div>
    <button id="ground"></button>
    <div id="credit">
      <span
        >©
        <a href="https://www.swisstopo.admin.ch/" target="_blank" rel="noopener">swisstopo</a></span
      >
      <span
        >©
        <a href="https://www.geo.bs.ch/" target="_blank" rel="noopener"
          >Geodaten Kanton Basel-Stadt</a
        ></span
      >
      <span
        >©
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener"
          >OpenStreetMap</a
        ></span
      >
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
